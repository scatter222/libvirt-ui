settings:
  imagesDirectory: /opt/launcher-apps/vms
  # VirtualBox machine files and disks for deployed VMs go to
  # <machinesDirectory>/<username>/<vm-name>/ (via import --basefolder).
  machinesDirectory: /storage/vbox-vms
  # Per-VM shared folders go to <sharedFoldersDirectory>/<username>/<vm-name>,
  # automounted into the guest as "shared" (needs Guest Additions in the
  # guest; appears as e.g. /media/sf_shared).
  sharedFoldersDirectory: /storage/vbox-share
  autoRefresh: true
  refreshInterval: 5000

vms:
  - name: sift-workstation
    displayName: SIFT Workstation
    description: SANS digital forensics and incident response environment
    category: forensics
    ovaFile: sift-workstation.ova
    # Maximum concurrent instances of this template (omit for unlimited)
    maxInstances: 3
    # Default specs for new instances; adjustable per instance at creation
    specs:
      memory: 4096
      cpus: 2
    tags:
      - forensics
      - dfir
      - ubuntu

  - name: remnux
    displayName: REMnux
    description: Malware analysis and reverse engineering toolkit
    category: malware-analysis
    ovaFile: remnux.ova
    maxInstances: 3
    specs:
      memory: 4096
      cpus: 2
    tags:
      - malware
      - reversing
      - sandbox
