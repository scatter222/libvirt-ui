settings:
  imagesDirectory: /opt/launcher-apps/vms
  # Root for all app-managed VM storage. Each deployed VM gets
  # <sharedFoldersDirectory>/<username>/<vm-name>/ holding its VirtualBox
  # machine files and disks (via import --basefolder), plus a shared/
  # subdirectory automounted into the guest as "shared" (needs Guest
  # Additions in the guest; appears as e.g. /media/sf_shared).
  sharedFoldersDirectory: /storage/vbox-vms
  autoRefresh: true
  refreshInterval: 5000

vms:
  - name: sift-workstation
    displayName: SIFT Workstation
    description: SANS digital forensics and incident response environment
    category: forensics
    ovaFile: sift-workstation.ova
    specs:
      memory: 4096
      cpus: 2
    tags:
      - forensics
      - dfir
      - ubuntu

  - name: remnux
    displayName: REMnux
    description: Malware analysis and reverse engineering toolkit
    category: malware-analysis
    ovaFile: remnux.ova
    specs:
      memory: 4096
      cpus: 2
    tags:
      - malware
      - reversing
      - sandbox
