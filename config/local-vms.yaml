settings:
  imagesDirectory: /opt/launcher-apps/vms
  # Host directory that holds per-user, per-VM shared folders.
  # Each deployed VM gets <sharedFoldersDirectory>/<username>/<vm-name>
  # automounted into the guest as "shared" (e.g. /media/sf_shared).
  sharedFoldersDirectory: ~/vm-shared
  autoRefresh: true
  refreshInterval: 5000

vms:
  - name: sift-workstation
    displayName: SIFT Workstation
    description: SANS digital forensics and incident response environment
    category: forensics
    ovaFile: sift-workstation.ova
    specs:
      memory: 4096
      cpus: 2
    tags:
      - forensics
      - dfir
      - ubuntu

  - name: remnux
    displayName: REMnux
    description: Malware analysis and reverse engineering toolkit
    category: malware-analysis
    ovaFile: remnux.ova
    specs:
      memory: 4096
      cpus: 2
    tags:
      - malware
      - reversing
      - sandbox
