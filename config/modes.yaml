# Deployment modes
#
# The active mode is NOT chosen here - it is read from a plain text file on the
# machine (see `modeFile` below). This file only defines what each mode means.
#
# Resolution order for the active mode (first hit wins):
#   1. LIBVIRT_UI_MODE environment variable
#   2. --mode=<id> command line switch
#   3. the mode file:
#        Linux   /etc/libvirt-ui/mode
#        Windows %PROGRAMDATA%\libvirt-ui\mode
#        macOS   /Library/Application Support/libvirt-ui/mode
#        or any path in LIBVIRT_UI_MODE_FILE, or <userData>/mode
#   4. defaultMode below
#
# The mode file is one line - just the mode id, e.g.
#   standalone
# `mode: standalone` (YAML) is accepted too. Comments and blank lines ignored.
# It is re-read while the app runs, so changing it flips the UI live.

defaultMode: full

# Applied to every mode before its own overrides.
defaults:
  dashboard: true
  tools: true
  vms: true
  remoteVms: true
  webApps: true
  rules: true
  api: true
  devTools: false

modes:
  full:
    label: Full Lab
    description: "Connected to the lab: every tab and feature is available."
    features: {}

  standalone:
    label: Standalone
    description: No connectivity to the lab API. Local VMs and tools only.
    features:
      remoteVms: false
      webApps: false
      rules: false
      api: false

  training:
    label: Training
    description: "Classroom build: tools and web apps, no VM lifecycle control."
    features:
      vms: false
      remoteVms: false
      rules: false

  maintenance:
    label: Maintenance
    description: Machine is being serviced. Everything but the dashboard is off.
    features:
      tools: false
      vms: false
      remoteVms: false
      webApps: false
      rules: false
      api: false
